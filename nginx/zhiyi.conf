# 智忆 nginx：同域反代，浏览器侧 /api、/gonline-api 同源
# resolver + 变量：动态解析容器名，避免后端容器重建后 IP 变化导致 502
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 智忆后端：转发时去掉 /api 前缀（对齐 Nuxt devProxy rewrite）
    location /api/ {
        set $upstream_api server:4302;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gonline 同源代理：本地无 gonline，占位转 server，调用时 404/502，不阻塞启动
    location /gonline-api/ {
        set $upstream_gonline server:4302;
        rewrite ^/gonline-api/(.*)$ /$1 break;
        proxy_pass http://$upstream_gonline;
        proxy_set_header Host $host;
    }

    # Nuxt SSR
    location / {
        set $upstream_web web:4301;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
